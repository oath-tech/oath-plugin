name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No internal words
        env:
          OATH_BLOCKED_WORDS: ${{ secrets.OATH_BLOCKED_WORDS }}
        run: scripts/check-words.sh .
      - name: JSON files parse
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/.mcp.json; do
            jq empty "$f"
          done
      - name: The server address is Oath's
        run: |
          url=$(jq -r '.mcpServers[].url' plugin/.mcp.json)
          test "$url" = "https://review.oathverified.com/api/mcp" || { echo "Unexpected address: $url"; exit 1; }
