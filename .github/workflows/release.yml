name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The tag matches the plugin version
        run: |
          version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, plugin $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: No internal words
        env:
          OATH_BLOCKED_WORDS: ${{ secrets.OATH_BLOCKED_WORDS }}
        run: scripts/check-words.sh .
      - name: Build the zip
        run: |
          zip_name="oath-plugin-$VERSION.zip"
          (cd plugin && zip -r -X "../$zip_name" . -x '.DS_Store')
          sha256sum "$zip_name" > "$zip_name.sha256"
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum=$(cut -d' ' -f1 "$ZIP.sha256")
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Oath plugin $VERSION" \
            --notes "SHA-256 of \`$ZIP\`: \`$sum\`. Check it before you upload the file: \`shasum -a 256 $ZIP\`."
